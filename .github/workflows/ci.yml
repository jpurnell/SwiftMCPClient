# Linux is the reason this exists. macOS is covered by the local quality gate on every commit,
# which runs the same build and the same suite plus twenty-odd static checkers; Linux is not
# built anywhere else, and the parts of this package that cannot work there — anything reaching
# a Keychain — are guarded rather than ported. Only this notices when a guard is missed.
#
# There is deliberately no macOS job. GitHub's newest macOS image ships Swift 6.1, and this
# package declares tools version 6.2, so that job could only ever report a toolchain that is
# older than the one every commit is already built against locally.
#
# No swift-actions/setup-swift either. It resolves versions from its own table, and a version
# missing from that table fails a run before a line is compiled. The official container is
# authoritative about what it contains.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5

      # SwiftOAuth is a private repository, so an anonymous clone fails at dependency
      # resolution with an error that reads like the network. This rewrites the HTTPS remote to
      # carry a token. The step is skipped when no secret is configured, so the failure that
      # follows is the honest one — "could not clone" — rather than a confusing auth error.
      - name: Authenticate private dependencies
        if: env.DEPS_TOKEN != ''
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          git config --global url."https://${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Preflight
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          swift --version
          if [ -z "${DEPS_TOKEN}" ]; then
            echo "::warning::No DEPS_TOKEN secret. SwiftOAuth is private, so resolution will fail."
          fi

      - name: Build
        run: swift build

      # What runs here is the portable core: transports, SSE framing, session state, backoff,
      # and the encrypted stores minus their key source. The Keychain-backed conveniences are
      # compiled out.
      - name: Test
        run: swift test
