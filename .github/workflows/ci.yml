# Linux is the reason this exists. macOS is covered by the local quality gate on every commit,
# which runs the same build and the same suite plus twenty-odd static checkers; Linux is not
# built anywhere else, and the parts of this package that cannot work there — anything reaching
# a Keychain — are guarded rather than ported. Only this notices when a guard is missed.
#
# There is deliberately no macOS job. GitHub's newest macOS image ships Swift 6.1, and this
# package declares tools version 6.2, so that job could only ever report a toolchain that is
# older than the one every commit is already built against locally.
#
# No swift-actions/setup-swift either. It resolves versions from its own table, and a version
# missing from that table fails a run before a line is compiled. The official container is
# authoritative about what it contains.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs, for checking a change to the workflow itself or a credential it depends on
  # without inventing a commit to trigger it.
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2
    # Job scope, not step scope. A step-level `env:` is not visible to that same step's `if:`,
    # so the guard below would have skipped authentication even once the secret existed —
    # failing identically whether or not it was configured, which is the worst kind of guard.
    env:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # SwiftOAuth is a private repository, so an anonymous clone fails at dependency
      # resolution with an error that reads like the network. This rewrites the HTTPS remote to
      # carry a token. The step is skipped when no secret is configured, so the failure that
      # follows is the honest one — "could not clone" — rather than a confusing auth error.
      - name: Authenticate private dependencies
        if: env.DEPS_TOKEN != ''
        run: |
          # `x-access-token:` is the documented username form and works for both classic and
          # fine-grained tokens. A bare `https://TOKEN@github.com/` works for classic ones and
          # fails for fine-grained, which reads as "repository not found" rather than as an
          # authentication problem.
          git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Preflight
        run: |
          swift --version
          # Every dependency now resolves over a public URL, so a missing token is no longer
          # a failure — this says so rather than warning about a private SwiftOAuth that is
          # no longer depended on. The secret and the step above are kept because the cost of
          # keeping them is a skipped step, and the cost of needing them again is a red run
          # that reads like a network problem.
          if [ -z "${DEPS_TOKEN}" ]; then
            echo "No DEPS_TOKEN. Expected: all dependencies are public."
          else
            echo "DEPS_TOKEN present but not required — every dependency is public. Note that"
            echo "fine-grained tokens expire, and an expired one fails as 'could not clone',"
            echo "which reads like a network problem."
          fi

      - name: Build
        run: swift build

      # What runs here is the portable core: transports, SSE framing, session state, backoff,
      # and the encrypted stores minus their key source. The Keychain-backed conveniences are
      # compiled out.
      - name: Test
        run: swift test
